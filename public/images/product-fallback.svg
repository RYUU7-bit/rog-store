<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e0a12"/>
      <stop offset="60%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a3c"/>
      <stop offset="100%" stop-color="#b0001a"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5001e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Cyber grid lines -->
  <g stroke="url(#gridGrad)" stroke-width="1" opacity="0.35">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="60" x2="600" y2="600"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="420" x2="600" y2="420"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
  </g>

  <!-- Tech corner accents -->
  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#e5001e" stroke-width="3"/>
  <path d="M 520 40 L 560 40 L 560 80" fill="none" stroke="#e5001e" stroke-width="3"/>
  <path d="M 40 520 L 40 560 L 80 560" fill="none" stroke="#e5001e" stroke-width="3"/>
  <path d="M 520 560 L 560 560 L 560 520" fill="none" stroke="#e5001e" stroke-width="3"/>

  <!-- Center Glowing Holographic ROG Shield / Eye Logo -->
  <g filter="url(#glow)">
    <!-- Stylized ROG Eye Wing -->
    <path d="M 230 200 C 330 170, 420 220, 440 310 C 390 280, 310 270, 230 330 C 270 290, 330 280, 370 290 C 340 250, 290 230, 230 200 Z" fill="url(#redGrad)"/>
    <polygon points="170,330 340,330 280,360 170,360" fill="url(#redGrad)"/>
    <polygon points="355,330 420,330 395,360 330,360" fill="#e5001e" opacity="0.85"/>
  </g>

  <!-- Product Silhouette Box -->
  <rect x="150" y="140" width="300" height="280" rx="12" fill="none" stroke="#e5001e" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Typography -->
  <text x="300" y="445" font-family="'Orbitron', 'Rajdhani', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    REPUBLIC OF GAMERS
  </text>
  <text x="300" y="480" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="700" fill="#ff4d6d" text-anchor="middle" letter-spacing="3">
    PREMIUM GAMING GEAR
  </text>
</svg>
