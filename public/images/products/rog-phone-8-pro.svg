  <text x="300" y="375" font-family="'Orbitron', sans-serif" font-size="13" font-weight="900" fill="#c084fc" text-anchor="middle" letter-spacing="2">ROG PHONE 8 PRO // 24GB RAM 1TB ANIME VISION</text>
