    <circle cx="275" cy="190" r="3"/><circle cx="285" cy="190" r="3"/><circle cx="295" cy="190" r="3"/><circle cx="305" cy="190" r="3"/><circle cx="315" cy="190" r="3"/><circle cx="325" cy="190" r="3"/>
    <circle cx="270" cy="200" r="3"/><circle cx="280" cy="200" r="3"/><circle cx="290" cy="200" r="3"/><circle cx="300" cy="200" r="3"/><circle cx="310" cy="200" r="3"/><circle cx="320" cy="200" r="3"/><circle cx="330" cy="200" r="3"/>
    <circle cx="285" cy="210" r="3"/><circle cx="295" cy="210" r="3"/><circle cx="305" cy="210" r="3"/><circle cx="315" cy="210" r="3"/>
