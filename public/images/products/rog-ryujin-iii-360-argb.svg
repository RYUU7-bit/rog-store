<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coolerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e0a2b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070512" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#coolerGlow)"/>
  <!-- 360 Radiator -->
  <rect x="80" y="80" width="440" height="90" rx="8" fill="#110d22" stroke="#7000ff" stroke-width="2"/>
  <circle cx="150" cy="125" r="35" fill="#070512" stroke="#ff0055" stroke-width="2"/>
  <circle cx="300" cy="125" r="35" fill="#070512" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="450" cy="125" r="35" fill="#070512" stroke="#7000ff" stroke-width="2"/>
  <!-- Pump Block with 3.5" LCD -->
  <rect x="230" y="220" width="140" height="110" rx="14" fill="#0e0a1f" stroke="#e5001e" stroke-width="2.5"/>
  <rect x="245" y="235" width="110" height="80" rx="8" fill="#030206" stroke="#c084fc" stroke-width="1.5"/>
  <polygon points="285,260 315,260 300,290" fill="#e5001e"/>
  <text x="300" y="305" font-family="'Orbitron', sans-serif" font-size="10" font-weight="900" fill="#00f0ff" text-anchor="middle">CPU: 42°C</text>
  <!-- Tubing -->
  <path d="M 270 220 Q 250 170 200 170" stroke="#ff0055" stroke-width="5" fill="none"/>
  <path d="M 330 220 Q 350 170 400 170" stroke="#00f0ff" stroke-width="5" fill="none"/>
  <text x="300" y="370" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#e5001e" text-anchor="middle" letter-spacing="2">ROG RYUJIN III 360 ARGB // 3.5" LCD AIO COOLER</text>
</svg>
