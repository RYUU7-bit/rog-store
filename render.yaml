services:
  - type: web
    name: rog-store
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "ROG Store"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://rog-store.onrender.com
      - key: LOG_LEVEL
        value: error
      # Sessions stored in DB so they survive container restarts / new instances
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: BAKONG_API_URL
        value: https://api-bakong.nbc.gov.kh
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_MERCHANT_NAME
        sync: false
      - key: BAKONG_MERCHANT_CITY
        sync: false
      - key: BAKONG_TOKEN
        sync: false
      # ── Telegram env vars
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

# ── PostgreSQL Database (recommended - add this in Render Dashboard instead) ──
# In Render Dashboard:
# 1. Create a new PostgreSQL database
# 2. Go to your web service → Environment
# 3. Add DATABASE_URL and link it to the Postgres internal connection string
# 
# This will automatically switch from SQLite to Postgres and persist all data.
